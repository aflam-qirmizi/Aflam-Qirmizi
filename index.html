<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قرمزي - جميع المسلسلات التركية المترجمة HD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial; }
    body { background: #0a0a0a; color: #fff; }
    
    header { background: #121212; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 999; border-bottom: 3px solid #E50914; }
   .logo { color: #E50914; font-size: 32px; font-weight: 900; }
   .search-area { padding: 15px; background: #1a1a1a; text-align: center; }
    #search { width: 90%; max-width: 600px; padding: 14px 20px; border-radius: 30px; border: 2px solid #E50914; background: #000; color: white; font-size: 16px; outline: none; }

   .section { padding: 20px 15px 5px; font-size: 22px; font-weight: bold; border-right: 4px solid #E50914; margin: 10px 15px; }

   .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 15px; }
    @media(min-width: 768px) { .grid { grid-template-columns: repeat(5, 1fr); } }
    
   .movie-card { background: #1a1a1a; border-radius: 10px; overflow: hidden; transition: 0.3s; }
   .movie-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(229,9,20,0.6); }
   .movie-card img { width: 100%; height: 320px; object-fit: cover; }
    
   .movie-info { padding: 12px; }
   .movie-info h3 { font-size: 16px; margin-bottom: 8px; height: 40px; overflow: hidden; }
    
    /* قسم الجودة */
   .quality-box { background: #111; padding: 10px; border-top: 1px solid #333; }
   .quality-box label { font-size: 12px; color: #aaa; }
   .quality-box select { width: 100%; padding: 6px; margin: 5px 0; background: #333; color: white; border: none; border-radius: 5px; }
    
    /* الأزرار */
   .btns { display: flex; }
   .btn { flex: 1; padding: 12px; text-decoration: none; font-weight: bold; color: white; text-align: center; transition: 0.2s; }
   .btn:hover { opacity: 0.8; }
   .watch { background: #E50914; }
   .download { background: #333; }

    footer { background: #111; padding: 30px 15px; text-align: center; margin-top: 30px; border-top: 3px solid #E50914; }
  </style>
</head>
