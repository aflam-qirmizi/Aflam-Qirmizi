<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قرمزي - المسلسلات التركية</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial'; }
    body { background: #000; color: #fff; }
    header { padding: 20px; text-align: center; border-bottom: 3px solid #E50914; }
   .logo { color: #E50914; font-size: 40px; font-weight: 900; }
   .search-area { padding: 15px; }
    #search { width: 95%; padding: 14px; border-radius: 30px; border: 2px solid #E50914; background: #111; color: white; font-size: 16px; display: block; margin: auto; }
   .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; }
   .movie-card { background: #111; border-radius: 10px; overflow: hidden; }
   .movie-card img { width: 100%; height: 300px; object-fit: cover; background: #222; }
   .movie-info { padding: 10px; text-align: right; }
   .movie-info h3 { font-size: 15px; margin-bottom: 8px; }
   .quality-box { padding: 10px; background: #1a1a1a; }
   .quality-box label { font-size: 12px; color: #aaa; display: block; margin-bottom: 4px; }
   .quality-box select { width: 100%; padding: 8px; background: #333; color: white; border: none; border-radius: 6px; margin-bottom: 10px; }
   .btns { display: flex; }
   .btn { flex: 1; padding: 12px; text-decoration: none; font-weight: bold; color: white; text-align: center; font-size: 15px; }
   .watch { background: #E50914; }
   .download { background: #333; }
  </style>
