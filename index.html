<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قرمزي - جميع المسلسلات التركية المترجمة</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial; }
    body { background: #0a0a0a; color: #fff; }
    header { background: #121212; padding: 15px; text-align: center; border-bottom: 3px solid #E50914; }
   .logo { color: #E50914; font-size: 35px; font-weight: 900; }
   .search-area { padding: 15px; background: #1a1a1a; text-align: center; }
    #search { width: 90%; max-width: 600px; padding: 14px; border-radius: 30px; border: 2px solid #E50914; background: #000; color: white; font-size: 16px; }
   .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 15px; }
    @media(min-width: 768px) { .grid { grid-template-columns: repeat(5, 1fr); } }
   .movie-card { background: #1a1a1a; border-radius: 12px; overflow: hidden; transition: 0.3s; }
   .movie-card:hover { transform: scale(1.05); }
   .movie-card img { width: 100%; height: 330px; object-fit: cover; }
   .movie-info { padding: 12px; }
   .movie-info h3 { font-size: 16px; margin-bottom: 8px; }
   .quality-box { background: #111; padding: 10px; border-top: 1px solid #333; }
   .quality-box select { width: 100%; padding: 6px; margin: 5px 0; background: #333; color: white; border: none; border-radius: 5px; }
   .btns { display: flex; }
   .btn { flex: 1; padding: 12px; text-decoration: none; font-weight: bold; color: white; text-align: center; }
   .watch { background: #E50914; }
   .download { background: #333; }
  </style>
</head>

  <header><div class="logo">قرمزي</div></header>

  <div class="search-area">
    <input type="text" id="search" placeholder="ابحث عن مسلسل تركي مترجم...">
  </div>

      <div class="movie-info"><h3>مرعشلي</h3></div>

        <select><option>جودة التحميل: 480p</option><option>720p HD</option><option>1080p FHD</option></select>
      </div>
